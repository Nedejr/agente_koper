version: '3.8'

services:
  # ============================================
  # QDRANT - Vector Database
  # ============================================
  qdrant:
    image: qdrant/qdrant:latest
    container_name: agente_koper_qdrant
    ports:
      - "6333:6333"      # HTTP API
      - "6334:6334"      # gRPC (opcional)
    volumes:
      - ./data/qdrant:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__LOG_LEVEL=INFO
    restart: unless-stopped
    healthcheck:
      test: timeout 5 bash -c '</dev/tcp/localhost/6333' || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - agente_koper_network


  # ============================================
  # BACKEND - FastAPI + LangChain + LangGraph
  # ============================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agente_koper_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./data/documents:/app/documents
    environment:
      # OpenRouter
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_DEFAULT_MODEL=${OPENROUTER_DEFAULT_MODEL:-meta-llama/llama-3.1-8b-instruct:free}
      
      # Qdrant
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_COLLECTION_NAME=${QDRANT_COLLECTION_NAME:-koper_knowledge}
      
      # Backend Config
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      
      # RAG Settings
      - CHUNK_SIZE=${CHUNK_SIZE:-1000}
      - CHUNK_OVERLAP=${CHUNK_OVERLAP:-200}
      - TOP_K_RESULTS=${TOP_K_RESULTS:-5}
      - MIN_SIMILARITY_SCORE=${MIN_SIMILARITY_SCORE:-0.7}
      
      # Agent Settings
      - CLASSIFIER_THRESHOLD=${CLASSIFIER_THRESHOLD:-0.6}
      - EVALUATOR_MIN_CONFIDENCE=${EVALUATOR_MIN_CONFIDENCE:-0.7}
      
      # Embeddings
      - EMBEDDINGS_MODEL=${EMBEDDINGS_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
    depends_on:
      qdrant:
        condition: service_healthy
    restart: unless-stopped
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000
    networks:
      - agente_koper_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ============================================
  # FRONTEND - Streamlit
  # ============================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agente_koper_frontend
    ports:
      - "8501:8501"
    volumes:
      - ./backend:/app/backend
      - ./frontend:/app/frontend
      - ./data:/app/data
    environment:
      # Backend API URL
      - API_URL=http://backend:8000
      # OpenRouter
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      # Qdrant
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    command: streamlit run frontend/streamlit_app.py --server.port=8501 --server.address=0.0.0.0
    networks:
      - agente_koper_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

# ============================================
# NETWORKS
# ============================================
networks:
  agente_koper_network:
    name: agente_koper_network
    driver: bridge

# ============================================
# VOLUMES (opcional - para persistência explícita)
# ============================================
volumes:
  qdrant_data:
